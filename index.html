<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Deezer Music Explorer | Search & Play Tracks</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="https://cdn-icons-png.flaticon.com/512/727/727245.png">
</head>
<body class="light">
    <div class="app-container">
        <!-- Header -->
        <header>
            <div class="logo">
                <i class="fas fa-headphones"></i>
                <h1>Deezer<span>Explorer</span></h1>
            </div>
            <button id="themeToggle" class="theme-btn" aria-label="Toggle theme">
                <i class="fas fa-moon"></i> Dark Mode
            </button>
        </header>

        <!-- Search Section -->
        <div class="search-wrapper">
            <div class="search-box">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="searchInput" placeholder="Search for songs, artists, albums... (e.g., Ed Sheeran, Daft Punk)" autocomplete="off">
                <button id="clearBtn" class="clear-btn" aria-label="Clear"><i class="fas fa-times"></i></button>
            </div>
            <div class="filter-bar">
                <span class="filter-label">Genre quick picks:</span>
                <button class="genre-chip" data-query="pop">Pop</button>
                <button class="genre-chip" data-query="rock">Rock</button>
                <button class="genre-chip" data-query="hip hop">Hip Hop</button>
                <button class="genre-chip" data-query="electronic">Electronic</button>
                <button class="genre-chip" data-query="jazz">Jazz</button>
            </div>
        </div>

        <!-- Results Info & Status -->
        <div class="status-bar">
            <div id="resultsInfo" class="results-info"></div>
            <div id="nowPlaying" class="now-playing">
                <i class="fas fa-music"></i> <span>No track playing</span>
            </div>
        </div>

        <!-- Track Grid -->
        <div class="tracks-grid" id="tracksGrid">
            <div class="loading-skeleton" id="loadingSkeleton">
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
            </div>
        </div>

        <!-- Audio Player (hidden, used for previews) -->
        <audio id="audioPlayer" preload="none"></audio>
    </div>

    <script src="script.js"></script>
</body>
</html>
